<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 | Gritch（グリッチ）</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#020202">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      --bg: #020202;
      --text: #f6f6f6;
      --red: #ff2b2b;
      --cyan: #7df5ff;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: var(--text);
      background:
        radial-gradient(circle at 74% 16%, rgba(255, 255, 255, 0.08), transparent 28rem),
        radial-gradient(circle at 12% 80%, rgba(255, 43, 43, 0.09), transparent 24rem),
        var(--bg);
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic Medium", "Yu Gothic", "Meiryo", system-ui, sans-serif;
      line-height: 1.8;
      text-align: center;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 0, rgba(255, 255, 255, 0.04) 1px, transparent 1px, transparent 6px);
      mix-blend-mode: screen;
      opacity: 0.28;
    }

    main {
      padding: 2rem;
    }

    .code {
      position: relative;
      margin: 0 0 0.6rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 7rem;
      font-weight: 900;
      line-height: 1;
    }

    .code::before,
    .code::after {
      content: attr(data-text);
      content: attr(data-text) / "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.6;
    }

    .code::before {
      transform: translate(0.35rem, -0.05rem);
      text-shadow: 0.1rem 0 var(--red);
      clip-path: polygon(0 12%, 100% 8%, 100% 44%, 0 40%);
    }

    .code::after {
      transform: translate(-0.3rem, 0.05rem);
      text-shadow: -0.1rem 0 var(--cyan);
      clip-path: polygon(0 62%, 100% 58%, 100% 88%, 0 92%);
    }

    .label {
      margin: 0 0 2rem;
      font-family: var(--mono);
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--red);
    }

    p {
      margin: 0 0 2.4rem;
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.95rem;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      min-height: 3rem;
      padding: 0.85rem 1.4rem;
      border: 1px solid rgba(255, 255, 255, 0.42);
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 900;
      color: #fff;
      text-decoration: none;
      background: rgba(0, 0, 0, 0.28);
      transition: border-color 0.25s ease, background 0.25s ease;
    }

    .back:hover,
    .back:focus-visible {
      border-color: var(--red);
      background: rgba(255, 43, 43, 0.12);
    }
  </style>
</head>
<body>
  <main>
    <h1 class="code" data-text="404">404</h1>
    <p class="label">SIGNAL LOST</p>
    <p>お探しのページは見つかりませんでした。<br>URLが変更されたか、削除された可能性があります。</p>
    <a class="back" href="/">BACK TO TOP --</a>
  </main>
</body>
</html>
